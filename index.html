<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KidBright32 Blockly & MicroPython Studio</title>
    
    <!-- 1. Blockly Core -->
    <script src="https://unpkg.com/blockly/blockly_compressed.js"></script>
    <!-- 2. Standard Blocks (จำเป็นต้องมีเพื่อแสดงบล็อก ตรรกะ, วนซ้ำ, คณิตศาสตร์, ข้อความ) -->
    <script src="https://unpkg.com/blockly/blocks_compressed.js"></script>
    <!-- 3. MicroPython Code Generator -->
    <script src="https://unpkg.com/blockly/python_compressed.js"></script>
    <!-- 4. Thai Language Pack -->
    <script src="https://unpkg.com/blockly/msg/th.js"></script>
    
    <!-- Google Font & Styling -->
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Sarabun', sans-serif;
        }

        body {
            background-color: #1e1e24;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* Top Navbar */
        header {
            background-color: #141416;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #ff6b00;
        }

        .logo {
            font-size: 1.2rem;
            font-weight: bold;
            color: #ff6b00;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .nav-buttons {
            display: flex;
            gap: 10px;
        }

        button {
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
            color: white;
            font-size: 0.9rem;
        }

        button:hover {
            opacity: 0.85;
            transform: translateY(-1px);
        }

        #usbBtn { background-color: #2563eb; }
        #bleBtn { background-color: #9333ea; }
        #modeBtn { background-color: #f59e0b; }
        .btn-run { background-color: #16a34a; }
        .btn-copy { background-color: #475569; }

        /* Main Workspace Layout */
        .main-container {
            display: flex;
            flex: 1;
            height: calc(100vh - 60px);
        }

        #blocklyDiv {
            flex: 1;
            height: 100%;
        }

        /* Right Side Panel */
        .side-panel {
            width: 450px;
            background-color: #18181b;
            border-left: 1px solid #27272a;
            display: flex;
            flex-direction: column;
        }

        .panel-header {
            background-color: #27272a;
            padding: 10px 15px;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.95rem;
        }

        .code-box-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 10px;
        }

        #pythonCodeBox {
            width: 100%;
            flex: 1;
            background-color: #09090b;
            color: #22c55e;
            border: 1px solid #27272a;
            border-radius: 6px;
            padding: 12px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.85rem;
            resize: none;
            outline: none;
        }

        /* Wokwi Simulation Container */
        #simContainer {
            height: 50%;
            border-top: 1px solid #27272a;
            display: none;
            flex-direction: column;
        }

        #simContainer iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <!-- Header / Navbar -->
    <header>
        <div class="logo">
            🤖 KidBright32 MicroPython Studio
        </div>
        <div class="nav-buttons">
            <button id="usbBtn" onclick="connectUSB()">🔌 เชื่อมต่อ USB</button>
            <button id="bleBtn" onclick="connectBLE()">📶 บลูทูธ (BLE)</button>
            <button id="modeBtn" onclick="toggleMode()">🔄 โหมด: บอร์ดจริง</button>
            <button class="btn-copy" onclick="copyPythonCode()">📋 คัดลอกโค้ด</button>
            <button class="btn-run" onclick="executeCode()">🚀 ส่งโค้ด / รันโค้ด</button>
        </div>
    </header>

    <!-- Main Workspace Layout -->
    <div class="main-container">
        <!-- Blockly Canvas -->
        <div id="blocklyDiv"></div>

        <!-- Right Side Panel (Code Preview & Simulation) -->
        <div class="side-panel">
            <div class="panel-header">
                <span>🐍 พรีวิวโค้ด MicroPython</span>
            </div>
            <div class="code-box-container">
                <textarea id="pythonCodeBox" readonly placeholder="โค้ดจะสร้างขึ้นที่นี่อัตโนมัติ..."></textarea>
            </div>

            <!-- Wokwi Simulator -->
            <div id="simContainer">
                <div class="panel-header">
                    <span>⚡ หน้าต่างจำลองการทำงาน (Wokwi)</span>
                </div>
                <iframe src="https://wokwi.com/projects/new/esp32"></iframe>
            </div>
        </div>
    </div>

    <!-- Blockly Toolbox Definition -->
    <xml id="toolbox" style="display: none">
        <!-- Category: LED Matrix -->
        <category name="📺 หน้าจอ LED" colour="#ff6b00">
            <block type="kb_matrix_text">
                <value name="TEXT">
                    <block type="text">
                        <field name="TEXT">Hello KidBright</field>
                    </block>
                </value>
            </block>
            <block type="kb_matrix_draw"></block>
            <block type="kb_matrix_clear"></block>
        </category>

        <!-- Category: Sensors & Switches -->
        <category name="🔘 สวิตช์ & เซนเซอร์" colour="#ff6b00">
            <block type="kb_read_button"></block>
            <block type="kb_read_light"></block>
        </category>

        <!-- Category: Buzzer & Accessories -->
        <category name="🔊 เสียง & USB Out" colour="#ff6b00">
            <block type="kb_buzzer"></block>
            <block type="kb_buzzer_volume">
                <value name="VOLUME">
                    <block type="math_number"><field name="NUM">50</field></block>
                </value>
            </block>
            <block type="kb_buzzer_freq">
                <value name="FREQ">
                    <block type="math_number"><field name="NUM">1000</field></block>
                </value>
            </block>
            <block type="kb_usb_output"></block>
        </category>

        <!-- Category: Delay & Time -->
        <category name="⏱️ เวลา & การหน่วง" colour="#5b80a5">
            <block type="time_delay">
                <value name="DELAY_TIME">
                    <block type="math_number"><field name="NUM">1</field></block>
                </value>
            </block>
        </category>

        <!-- Category: Clock / RTC -->
        <category name="⏰ นาฬิกา RTC" colour="#2b8cbe">
            <block type="kb_rtc_sync_ntp"></block>
            <block type="kb_rtc_get_time"></block>
            <block type="kb_rtc_set_time"></block>
        </category>

        <!-- Category: Bluetooth BLE -->
        <category name="📶 บลูทูธ (BLE)" colour="#8e44ad">
            <block type="kb_ble_init">
                <value name="NAME">
                    <block type="text"><field name="TEXT">KidBright32</field></block>
                </value>
            </block>
            <block type="kb_ble_send"></block>
            <block type="kb_ble_read"></block>
            <block type="kb_ble_is_connected"></block>
        </category>

        <!-- Category: WiFi & Network -->
        <category name="🌐 WiFi & เครือข่าย" colour="#16a085">
            <block type="kb_wifi_connect">
                <value name="SSID">
                    <block type="text"><field name="TEXT">WiFi_Name</field></block>
                </value>
                <value name="PASSWORD">
                    <block type="text"><field name="TEXT">WiFi_Password</field></block>
                </value>
            </block>
            <block type="kb_wifi_is_connected"></block>
            <block type="kb_wifi_get_ip"></block>
            <block type="kb_http_get"></block>
        </category>

        <!-- Category: GPIO & Servo -->
        <category name="🔌 GPIO & เซอร์โว" colour="#a5805b">
            <block type="digital_write"></block>
            <block type="analog_read"></block>
            <block type="servo_move"></block>
        </category>

        <sep></sep>

        <!-- Standard Blockly Categories -->
        <category name="🔀 ตรรกะ" colour="#5b80a5">
            <block type="controls_if"></block>
            <block type="logic_compare"></block>
            <block type="logic_operation"></block>
            <block type="logic_boolean"></block>
            <block type="logic_negate"></block>
        </category>

        <category name="🔁 วนซ้ำ" colour="#5ba55b">
            <block type="controls_repeat_ext">
                <value name="TIMES">
                    <block type="math_number"><field name="NUM">10</field></block>
                </value>
            </block>
            <block type="controls_whileUntil"></block>
            <block type="controls_for">
                <value name="FROM">
                    <block type="math_number"><field name="NUM">1</field></block>
                </value>
                <value name="TO">
                    <block type="math_number"><field name="NUM">10</field></block>
                </value>
                <value name="BY">
                    <block type="math_number"><field name="NUM">1</field></block>
                </value>
            </block>
        </category>

        <category name="🔢 คณิตศาสตร์" colour="#5b67a5">
            <block type="math_number"><field name="NUM">0</field></block>
            <block type="math_arithmetic"></block>
            <block type="math_random_int">
                <value name="FROM">
                    <block type="math_number"><field name="NUM">1</field></block>
                </value>
                <value name="TO">
                    <block type="math_number"><field name="NUM">100</field></block>
                </value>
            </block>
        </category>

        <category name="📝 ข้อความ" colour="#5ba58c">
            <block type="text"></block>
            <block type="text_join"></block>
            <block type="text_length"></block>
        </category>

        <category name="📦 ตัวแปร" custom="VARIABLE" colour="#a55ba5"></category>
    </xml>

    <!-- App Logic -->
    <script src="app.js"></script>

</body>
</html>
